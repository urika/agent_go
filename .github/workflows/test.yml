name: Test & Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install -e .
          pip install pytest pytest-mock ruff mypy

      - name: Run tests
        run: |
          pytest tests/ -q

      # 发布门禁：$/pass rate 不劣化（PRD 北极星指标）
      # 无完成任务或无 metering 数据时自动通过（None 语义），不阻挡新项目/早期仓库。
      # 有数据后超阈即红。基线 0.05 = PRD Q3 目标。
      - name: $/pass rate gate
        run: |
          agent_go eval gate --baseline 0.05

      - name: Ruff lint (includes F401 unused-import)
        run: |
          ruff check agent_go/ --select=E,F,W --ignore=E501

      - name: MyPy type check
        run: |
          mypy agent_go/ --ignore-missing-imports
