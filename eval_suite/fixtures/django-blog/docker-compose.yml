version: "3.9"
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: django_blog
      POSTGRES_USER: blog_user
      POSTGRES_PASSWORD: blog_pass
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U blog_user -d django_blog"]
      interval: 3s
      timeout: 2s
      retries: 10
    tmpfs: /var/lib/postgresql/data
