# M3 任务 7: vibe-astock 跨文件重构（hard）
# 场景：跨文件重构——统一 _tx_symbol 重复实现
id: va-refactor-tx-symbol-dedup
difficulty: hard
repo: /private/var/folders/c2/z2ghnzmd4dv9r97cctvd3kyw0000gn/T/opencode/m1_targets/vibe-astock
task: |
  跨文件重构：消除 _tx_symbol 的重复实现。
  - emotion_metrics.py 和 reflection.py 都有 `_tx_symbol(code: str) -> str`（股票代码加交易所前缀，如 600519 → sh600519）
  - 要求：将权威实现保留在 util.py 中（新增 `tx_symbol(code: str) -> str`），emotion_metrics.py 和 reflection.py 改为从 util 导入
  - 保持行为完全一致（沪市 sh/深市 sz/北交所 bj 前缀规则）
  - 不改对外接口（两个模块的 _tx_symbol 仍可被调用，但内部委托 util.tx_symbol）
  - 范围限制：只改 duanxian/ 下的 3 个 Python 文件（util.py/emotion_metrics.py/reflection.py）。
    禁止修改 frontend/、tests/、.gitignore 及任何无关文件。
    如果首次产出已正确（3 文件 + 验证通过），不要继续修复无关的既有失败。
  - 验证范围：只跑 tests/test_core_logic.py（不要跑 tests/ 全量目录）。
  - 既有失败：tests/test_core_logic.py 有 2 个与本任务无关的既有失败
    (spa_fallback、error_says_which)，验证时必须用 -k "not (spa_fallback or error_says_which)"
    排除。注意：-k 只支持测试函数名关键字，不支持 Class::method nodeid 语法。
    不要尝试修复这 2 个既有失败，不要跑 tests/ 全量目录。

  验证命令规范（重要）：
  - 用 `python -m pytest tests/test_core_logic.py -k "not (spa_fallback or error_says_which)"` 形式
    （python -m 会把 cwd 加入 sys.path，避免裸 pytest 时 No module named 'duanxian'）
  - 不要用裸 `pytest`（无 python -m）——cwd 不在 sys.path 会导致 duanxian 包无法导入
  - 不要用管道 | / 重定向 / 命令链
verification:
  - "python -m pytest tests/test_core_logic.py -q -k \"not (spa_fallback or error_says_which)\""
  - "python -c \"from duanxian import util, emotion_metrics, reflection; assert util.tx_symbol('600519')=='sh600519'; assert emotion_metrics._tx_symbol('000001')==util.tx_symbol('000001'); assert reflection._tx_symbol('300750')==util.tx_symbol('300750'); print('OK')\""
timeout: 900
cost_control:
