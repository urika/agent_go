  - "node --experimental-strip-types -e \"import { getFilteredNews } from './src/lib/news.ts'; import { NEWS_DATA } from './src/data/news.ts'; const kw = getFilteredNews(NEWS_DATA, { keyword: '网关' }); if (kw.length !== 1) process.exit(1); const cat = getFilteredNews(NEWS_DATA, { category: '产品发布' }); if (cat.length !== 2) process.exit(1); const none = getFilteredNews(NEWS_DATA, { keyword: '不存在的关键词xyz' }); if (none.length !== 0) process.exit(1); console.log('OK')\""
