id: refactor-to-dict
difficulty: medium
repo: /Users/jinsongwang/test-target/task-mgr
task: |
  将 src/storage.py 中的 TaskStorage 从 `list[Task]` 内部存储改为 `dict[str, Task]`（以 task.id 为键）。
  
  具体改动：
  - TaskStorage 内部新增 self._tasks: dict[str, Task] 属性
  - load_all 改为先 load 到 dict，再返回 list(Task)
  - save 改为直接插入/更新 dict，再写 JSON
  - 新增 update(task: Task) 方法：如果 task.id 已存在则更新，否则追加
  - to_dict() 写 JSON 时遍历 dict values
  - 对外接口（load_all / save）行为完全不变，现有 tests 全部通过
verification:
  - "python -m pytest tests/test_storage.py tests/test_models_utils.py -q"
  - "python -c \"from src.storage import TaskStorage; from src.models import Task; from pathlib import Path; p=Path('/tmp/test_dict.json'); s=TaskStorage(p); t1=Task('a',task_id='1'); t2=Task('b',task_id='1'); s.save(t1); s.save(t2); assert len(s.load_all())==1; assert s.load_all()[0].description=='b'; print('OK')\""
timeout: 700

# S10 成本控制（默认关闭；开启前先基于 bench 实测校准预算）
cost_control:
  enabled: false
  max_budget_usd: 0.25
  per_subtask_budget_usd: 0.2
