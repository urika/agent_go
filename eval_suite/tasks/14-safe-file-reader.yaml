id: safe-file-reader
difficulty: medium
repo: eval_suite/fixtures/fp-sandbox
task: |
  在文件 solution.py 中实现以下函数：

  1. safe_read(path: str) -> str
     - 如果文件存在且可读，返回文件内容（UTF-8）
     - 如果文件不存在，返回空字符串
     - 注意不要抛出异常

  2. list_text_files(directory: str) -> list[str]
     - 列出目录下所有 .txt 文件（仅文件名，不含路径）
     - 不递归子目录
     - 目录不存在返回空列表

  这是一个单文件小任务：直接在 solution.py 中实现三个函数即可，
  不需要额外的审查、重构或验证步骤，一步完成。
  verification 命令中的断言即为全部验收标准。
verification:
  - "python3 -c \"from solution import safe_read, list_text_files; import inspect, tempfile, os; assert callable(safe_read); assert callable(list_text_files); f=tempfile.NamedTemporaryFile(mode='w', suffix='.txt', delete=False); f.write('hello'); f.close(); assert safe_read(f.name)=='hello'; os.unlink(f.name); assert safe_read('/nonexistent/path')==''; d=tempfile.mkdtemp(); open(d+'/a.txt','w').close(); open(d+'/b.txt','w').close(); r=list_text_files(d); assert len(r)==2; import shutil; shutil.rmtree(d)\""
timeout: 504

# S10 成本控制（默认关闭；开启前先基于 bench 实测校准预算）
cost_control:
  enabled: false
  max_budget_usd: 0.25
  per_subtask_budget_usd: 0.2
  on_exceed: stop
