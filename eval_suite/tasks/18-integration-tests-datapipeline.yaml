id: integration-tests-datapipeline
difficulty: hard
repo: eval_suite/fixtures/data-pipeline
task: |
  Build a comprehensive integration test suite for the data pipeline from CLI:

  1. Create `tests/fixtures/` directory with:
     - `sample.csv`: valid CSV with 10 rows and 3 columns
     - `pipeline_valid.json`: valid pipeline config (CSV extract → filter → map → file load)
     - `pipeline_invalid.json`: pipeline with unknown stage type
  2. Create `tests/test_cli_integration.py` testing:
     - Full end-to-end pipeline via `cli.cmd_run()` — verify output file is created with correct content
     - Pipeline with missing input file exits with non-zero and error message
     - Pipeline with invalid config exits with non-zero and validation error details
     - `list-stages` subcommand prints all 7 registered stage types
     - `validate` subcommand validates the valid config (exit 0) and invalid config (exit 1)
  3. Create `conftest.py` with reusable fixtures:
     - `temp_dir`: temporary directory with lifecycle cleanup
     - `sample_csv`: generates `fixtures/sample.csv` path
     - `valid_config`: returns parsed pipeline_valid.json path
  4. Ensure all integration tests are idempotent (running twice produces same result) and clean up after themselves
verification:
  - "python -m pytest tests/test_cli_integration.py tests/test_cli.py -q"
  - "python -c \"from pathlib import Path; assert Path('tests/fixtures/sample.csv').exists(); print('fixtures OK')\""
# 2026-08-24：600 → 900。三臂 bench 实测本任务为 600s 量级——云端两臂、27B r1
# 全部贴线撞墙（bench grace 提前 60s SIGTERM，有效 540s），27B r2 未完工被截断。
# hard e2e 任务对慢后端（本地 4bit 串行）需更长窗口。
timeout: 900

# S10 成本控制（默认关闭；开启前先基于 bench 实测校准预算）
cost_control:
  enabled: false
  max_budget_usd: 0.6
  per_subtask_budget_usd: 0.5
  on_exceed: stop
