id: db-performance-optimization
difficulty: hard
repo: eval_suite/fixtures/django-blog
initial_tag: v0.1-initial
task: |
  Optimize the Django blog API's database performance to reduce query count
  from N+1 (41+ queries for 10 posts) to ≤5 queries on the post listing endpoint.

  Prerequisites:
    - PostgreSQL running on 127.0.0.1:15432 (docker compose up -d)
    - Fixture at tag v0.1-initial (git checkout v0.1-initial if modified)

  The code has these intentional anti-patterns:

  1. **N+1 queries** in PostListSerializer — each post triggers 4 extra queries
     (author profile via SerializerMethodField, comment_count, tag names).
     Fix: select_related('author__profile', 'category') + annotate(comment_count)
     + prefetch_related('tags'). Performance test expects ≤5 queries for 10 posts.

  2. **Missing indexes** — created_at (archive queries), author_id
     (author filter), (post_id, created_at) composite (comment listing).
     Add db_index or Meta.indexes in models.py + migration.

  3. **Inefficient loop aggregation** — category_stats view does N+1 COUNT queries
     per category. Fix: single annotated query with .annotate(post_count=Count('posts'),
     avg_views=Avg('view_count')). Performance test expects ≤2 queries.

  4. **No caching** — category list and trending data recomputed on every request.
     Add Django's cache framework (locmem for test, Redis for prod) with TTL.
     Consider signals for cache invalidation on model save.

  5. **Inefficient search** — LIKE %keyword% forces full scan. Optional:
     migrate to PostgreSQL full-text search (SearchVector/SearchQuery).

  6. **No caching** — implement Django cache for post_list. Enable Q6 test
     by removing `@pytest.mark.skip` in test_performance.py. Target: warm
     response < 30% of cold response time.

  7. **High concurrent P95** — N+1 amplifies under load. Enable Q7 test
     after implementing select_related + caching + indexing. Target:
     P95 < 500ms with 50 concurrent requests, zero errors.

  IMPORTANT: Each optimization must preserve test_blog_api.py correctness.
  Run test_performance.py before and after to measure improvement.
  Enable Q6/Q7 tests by removing @pytest.mark.skip after implementing
  the corresponding optimizations.
verification:
  - "python -m pytest tests/test_blog_api.py -q"
  - "pip install -e . && python -m pytest tests/test_performance.py -q -v"
timeout: 2700  # CR-timeout：实测 ~2180s，仅留 50s 余量会 cleanup_race；放宽到 45min

# S10 成本控制（默认关闭；开启前先基于 bench 实测校准预算）
cost_control:
  enabled: false
  max_budget_usd: 0.6
  per_subtask_budget_usd: 0.5
  on_exceed: stop
