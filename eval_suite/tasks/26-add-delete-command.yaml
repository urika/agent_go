id: add-delete-command
difficulty: easy
repo: eval_suite/fixtures/task-mgr
task: |
  在 src/cli.py 中实现 cmd_delete 命令（删除任务）：

  - 接收 task_id 参数（如 `delete abc123`）
  - 使用模块级 DATA_FILE 构造 TaskStorage，加载所有任务，找到 id 匹配的任务并移除
  - 需要在 TaskStorage 新增 delete(task_id: str) -> bool 方法：
    - 删除 id 匹配的任务并写回存储，返回 True
    - 未找到返回 False，不写文件
  - 更新 main() 注册 "delete" 子命令
  - 删除成功打印 `Deleted task #<id>`，未找到打印 `Task #<id> not found`（返回 1）

  verification 命令中的断言即为全部验收标准。
verification:
  - "python3 -c \"import sys; sys.path.insert(0, 'src'); from pathlib import Path; from src.storage import TaskStorage; from src.models import Task; import src.cli as cli; p=Path('/tmp/test_del.json'); p.unlink(missing_ok=True); cli.DATA_FILE=p; s=TaskStorage(p); t1=Task('a', task_id='t1'); t2=Task('b', task_id='t2'); s.save(t1); s.save(t2); assert cli.cmd_delete('t1')==0; remaining=s.load_all(); assert [t.id for t in remaining]==['t2']; assert cli.cmd_delete('nope')==1; assert len(s.load_all())==1; p.unlink(missing_ok=True); print('OK')\""
timeout: 444

# S10 成本控制（默认关闭；开启前先基于 bench 实测校准预算）
cost_control:
  enabled: false
  max_budget_usd: 0.15
  per_subtask_budget_usd: 0.1
  on_exceed: stop
