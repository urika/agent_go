id: add-priority-filter
difficulty: medium
repo: eval_suite/fixtures/task-mgr
task: |
  扩展 cmd_list 命令，支持按优先级过滤：

  当前 cmd_list(status: str) 只按 status 过滤。需求：
  - Task 模型新增 priority 字段：__init__ 增加 `priority: str = "medium"` 参数
    （可选值 "low"/"medium"/"high"）；to_dict()/from_dict() 读写该字段（from_dict 缺省 "medium"）
  - cmd_list 增加可选参数 priority: str = ""（"low"/"medium"/"high"，空 = 不过滤）
  - 过滤逻辑：先按 status（若指定），再按 priority（若指定）
  - 打印格式保持 `#<id> [<status>] <description>` 不变（优先级不显示在行首）
  - 无匹配时打印 "No tasks." 并返回 0
  - main() 的 list 子命令支持 `list [status] [--priority X]`

  verification 命令中的断言即为全部验收标准。
verification:
  - "python3 -c \"import sys; sys.path.insert(0, 'src'); from pathlib import Path; from src.storage import TaskStorage; from src.models import Task; import src.cli as cli; import io; p=Path('/tmp/test_prio.json'); p.unlink(missing_ok=True); cli.DATA_FILE=p; s=TaskStorage(p); s.save(Task('a', task_id='t1', status='todo', priority='high')); s.save(Task('b', task_id='t2', status='todo', priority='low')); s.save(Task('c', task_id='t3', status='done', priority='high')); buf=io.StringIO(); _old=sys.stdout; sys.stdout=buf; rc=cli.cmd_list('todo', priority='high'); sys.stdout=_old; out=buf.getvalue(); assert rc==0; assert 't1' in out and 't2' not in out, out; buf2=io.StringIO(); _old2=sys.stdout; sys.stdout=buf2; cli.cmd_list(priority='high'); sys.stdout=_old2; out2=buf2.getvalue(); assert 't1' in out2 and 't3' in out2 and 't2' not in out2, out2; p.unlink(missing_ok=True); print('OK')\""
timeout: 700

# S10 成本控制（默认关闭；开启前先基于 bench 实测校准预算）
cost_control:
  enabled: false
  max_budget_usd: 0.25
  per_subtask_budget_usd: 0.2
  on_exceed: stop
