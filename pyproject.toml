[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "agent_go"
version = "2.0.0"
description = "Plan Mode orchestration tool — decomposes tasks, runs them in isolated worktrees with Claude Code"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
agent_go = "agent_go.cli:main"

[tool.setuptools.packages.find]
include = ["agent_go*"]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
# E: pycodestyle  F: Pyflakes (含 F401 unused-import)  W: pycodestyle warnings
select = ["E", "F", "W"]
ignore = ["E501"]  # 行长度由 formatter 管理

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
# JSON 读取/配置合并固有返回 Any（load_config/eval 读取），显式收窄是样板代码；
# 保留其余严格检查（Optional 未检查/运算符/attr 等真实类型问题仍报错）
warn_return_any = false
warn_unused_configs = true
disable_error_code = ["annotation-unchecked"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# --tb=short 精简失败堆栈；addopts 让所有 pytest 调用默认生效
addopts = "--tb=short"
# 注册自定义 marker，避免 pytest 对未知 marker 报 warning
markers = [
    "flaky: 标记已知 flaky 测试（需配合 rerun 机制，当前仅作标注）",
]
